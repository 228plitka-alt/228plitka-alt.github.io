<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Планировщик учебного дня</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Подключаем иконки Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-wrapper">
  
  <!-- ЛЕВОЕ БОКОВОЕ МЕНЮ -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <i class="bi bi-calendar-check fs-3 me-2"></i>
      <div>
        <h5 class="mb-0 fw-bold text-white">Планировщик</h5>
        <small class="text-muted">учебного дня</small>
      </div>
    </div>

    <nav class="sidebar-nav mt-4">
      <a href="#" class="nav-item active"><i class="bi bi-calendar3 me-3"></i>Сегодня</a>
      <a href="#" class="nav-item"><i class="bi bi-calendar-week me-3"></i>Неделя</a>
      <a href="#" class="nav-item"><i class="bi bi-check2-square me-3"></i>Задачи</a>
      <a href="#" class="nav-item"><i class="bi bi-bar-chart me-3"></i>Статистика</a>
    </nav>

    <div class="sidebar-footer mt-auto">
      <div class="date-box">
        <i class="bi bi-calendar-event me-2"></i>
        <div>
          <small class="d-block text-muted">Четверг</small>
          <span class="text-white fw-semibold">19 ноября 2026</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- ПРАВАЯ ОСНОВНАЯ ЧАСТЬ -->
  <main class="main-content">
    
    <!-- Шапка -->
    <header class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold mb-1">Мой учебный день</h2>
        <p class="text-muted mb-0">Планируй. Отмечай. Достигай результатов!</p>
      </div>
      <button class="btn btn-primary-custom rounded-pill px-4 py-2" data-bs-toggle="modal" data-bs-target="#addTaskModal">
        <i class="bi bi-plus-lg me-2"></i>Добавить занятие
      </button>
    </header>

    <!-- Панель фильтров и даты -->
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
      <div class="btn-group filter-group bg-light rounded-pill p-1">
        <button class="btn btn-sm btn-filter active" data-filter="all">Все (0)</button>
        <button class="btn btn-sm btn-filter" data-filter="upcoming">Предстоящие (0)</button>
        <button class="btn btn-sm btn-filter" data-filter="done">Выполненные (0)</button>
      </div>
      
      <div class="d-flex align-items-center gap-2 bg-white border rounded-3 px-3 py-1">
        <button class="btn btn-sm btn-light"><i class="bi bi-chevron-left"></i></button>
        <span class="fw-semibold px-2">19 ноября 2026</span>
        <button class="btn btn-sm btn-light"><i class="bi bi-chevron-right"></i></button>
      </div>
    </div>

    <!-- Список занятий (Сюда JS будет добавлять карточки) -->
    <div class="schedule-list mb-4" id="taskList">
      <div class="text-center text-muted py-5 empty-state" id="emptyState">
        На этот день занятий нет.
      </div>
    </div>

    <!-- Блок статистики снизу -->
    <div class="row g-4 mt-4" id="stats">
      
      <!-- Прогресс -->
      <div class="col-md-5">
        <div class="card stat-card h-100">
          <div class="card-body d-flex align-items-center gap-4">
            <!-- Круговой прогресс (заглушка) -->
            <div class="progress-circle" id="progressCircle" data-value="40">
              <div class="progress-inner">
                <span class="fw-bold fs-4" id="statPercent">0%</span>
              </div>
            </div>
            <div>
              <small class="text-muted d-block mb-1">Выполнено занятий</small>
              <h5 class="mb-0 fw-bold"><span id="statDone">0</span> из <span id="statTotal">0</span></h5>
            </div>
          </div>
        </div>
      </div>

      <!-- Предстоит -->
      <div class="col-md-3">
        <div class="card stat-card h-100">
          <div class="card-body d-flex align-items-center gap-3">
            <div class="icon-box bg-light text-primary"><i class="bi bi-journal-text fs-4"></i></div>
            <div>
              <h4 class="mb-0 fw-bold" id="statLeft">0</h4>
              <small class="text-muted">Предстоит</small>
            </div>
          </div>
        </div>
      </div>

      <!-- Выполнено -->
      <div class="col-md-4">
        <div class="card stat-card h-100">
          <div class="card-body d-flex align-items-center gap-3">
            <div class="icon-box bg-success-subtle text-success"><i class="bi bi-check2-circle fs-4"></i></div>
            <div>
              <h4 class="mb-0 fw-bold"><span id="statDone2">0</span></h4>
              <small class="text-muted">Выполнено</small>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- МОДАЛЬНОЕ ОКНО ДОБАВЛЕНИЯ -->
<div class="modal fade" id="addTaskModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold">Добавить занятие</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="taskForm">
          <div class="mb-3">
            <label class="form-label text-muted small">Название занятия *</label>
            <input type="text" class="form-control" id="taskTitle" placeholder="Например: Математика" required>
          </div>
          
          <div class="row g-3 mb-3">
            <div class="col-6">
              <label class="form-label text-muted small">Время начала *</label>
              <input type="time" class="form-control" id="taskStart" required>
            </div>
            <div class="col-6">
              <label class="form-label text-muted small">Время окончания *</label>
              <input type="time" class="form-control" id="taskEnd" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label text-muted small">Аудитория</label>
            <input type="text" class="form-control" id="taskRoom" placeholder="Например: 301">
          </div>

          <div class="mb-3">
            <label class="form-label text-muted small">Преподаватель</label>
            <input type="text" class="form-control" id="taskTeacher" placeholder="ФИО преподавателя">
          </div>

          <div class="mb-3">
            <label class="form-label text-muted small">Описание (необязательно)</label>
            <textarea class="form-control" id="taskDesc" rows="2" placeholder="Тема, задания..."></textarea>
          </div>

          <div id="formError" class="text-danger small mb-2"></div>

          <div class="d-flex justify-content-end gap-2 mt-4">
            <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">Отмена</button>
            <button type="submit" class="btn btn-primary-custom px-4">Добавить</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
